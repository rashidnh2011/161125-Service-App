<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://arabscalecalibration.com/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BizOps360" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BizOps360" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://arabscalecalibration.com/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://arabscalecalibration.com/logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="https://arabscalecalibration.com/logo.png" />
    <title>BizOps360 - Complete CRM System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);

              // Check for install prompt availability
              window.addEventListener('beforeinstallprompt', (e) => {
                console.log('PWA install prompt available');
                // Prevent the mini-infobar from appearing on mobile
                e.preventDefault();
                // Stash the event so it can be triggered later
                window.deferredPrompt = e;
              });

              // Listen for app installed event
              window.addEventListener('appinstalled', () => {
                console.log('PWA was installed');
                window.deferredPrompt = null;
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
